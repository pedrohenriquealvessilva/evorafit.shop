<html lang="pt-BR">
<head>

<title>EVORA FIT — Treine. Evolua. Supere você mesmo.</title>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0c'/%3E%3Cg fill='%237c5cff'%3E%3Crect x='14' y='34' width='9' height='16' rx='2'/%3E%3Crect x='27.5' y='24' width='9' height='26' rx='2'/%3E%3Crect x='41' y='12' width='9' height='38' rx='2'/%3E%3C/g%3E%3C/svg%3E">

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ============================================================ */
/* TOKENS                                                        */
/* ============================================================ */
:root{
  --accent:#7c5cff;
  --accent-2:#9b7bff;
  --accent-soft:rgba(124,92,255,.14);
  --success:#34d399;
  --success-soft:rgba(52,211,153,.14);
  --warning:#fbbf24;
  --danger:#f87171;
  --danger-soft:rgba(248,113,113,.14);
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --font-display:'Manrope',sans-serif;
  --font-body:'Inter',sans-serif;
  --shadow-1:0 1px 2px rgba(0,0,0,.16);
  --shadow-2:0 8px 30px rgba(0,0,0,.28);
}
[data-theme="dark"]{
  --bg:#0a0a0c;
  --surface:#141417;
  --surface-elevated:#1c1c21;
  --surface-hover:#222228;
  --text-primary:#f5f5f7;
  --text-secondary:#a6a6b0;
  --text-muted:#6c6c76;
  --border:#26262c;
  --border-strong:#34343c;
  --overlay:rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#f6f6f8;
  --surface:#ffffff;
  --surface-elevated:#ffffff;
  --surface-hover:#f0f0f3;
  --text-primary:#161618;
  --text-secondary:#5b5b64;
  --text-muted:#93939c;
  --border:#e6e6ea;
  --border-strong:#d5d5db;
  --overlay:rgba(20,20,24,.5);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--text-primary);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  min-height:100vh; overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:800; letter-spacing:-.02em; color:var(--text-primary);}
button,input,select,textarea{font-family:inherit; color:inherit;}
input,select,textarea{font-size:16px;}
button{cursor:pointer; border:none; background:none;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
.icon{width:20px; height:20px; display:inline-block; vertical-align:middle; stroke-width:2;}
.hidden{display:none !important;}
.muted{color:var(--text-secondary);}
.faint{color:var(--text-muted);}

/* ============================================================ */
/* LAYOUT SHELL                                                  */
/* ============================================================ */
#app{min-height:100vh; width:100%;}
#auth-root{width:100%;}
#app-root{display:flex; width:100%; min-height:100vh;}

.sidebar{
  width:248px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:8px 10px 22px;}
.brand-mark{width:30px; height:30px; flex-shrink:0;}
.brand-name{font-family:var(--font-display); font-weight:800; font-size:16.5px; letter-spacing:-.02em;}
.nav-group-label{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--text-muted); text-transform:uppercase; padding:16px 12px 6px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--radius-s);
  color:var(--text-secondary); font-weight:600; font-size:14px; width:100%; text-align:left;
  transition:background .15s, color .15s;
}
.nav-item .icon{width:18px; height:18px; flex-shrink:0;}
.nav-item:hover{background:var(--surface-hover); color:var(--text-primary);}
.nav-item.active{background:var(--accent-soft); color:var(--accent);}
.sidebar-footer{margin-top:auto; padding-top:10px; border-top:1px solid var(--border);}

.topbar{
  display:none; align-items:center; justify-content:space-between; padding:14px 16px;
  background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:40;
}
.icon-btn{
  width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  border-radius:var(--radius-s); background:var(--surface-elevated); border:1px solid var(--border);
}
.icon-btn:active{background:var(--surface-hover);}

.drawer-overlay{position:fixed; inset:0; background:var(--overlay); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s;}
.drawer-overlay.open{opacity:1; pointer-events:auto;}
.drawer{
  position:fixed; top:0; left:0; height:100%; width:78%; max-width:300px; background:var(--surface);
  z-index:61; transform:translateX(-100%); transition:transform .25s cubic-bezier(.2,.8,.2,1);
  padding:20px 14px; overflow-y:auto; border-right:1px solid var(--border);
}
.drawer.open{transform:translateX(0);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.view{max-width:920px; width:100%; margin:0 auto; padding:28px 24px 90px;}

@media (max-width: 900px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  .view{padding:18px 16px 90px;}
}

/* ============================================================ */
/* GENERIC COMPONENTS                                            */
/* ============================================================ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px;}
.card-elevated{background:var(--surface-elevated); border:1px solid var(--border); border-radius:var(--radius-l); padding:22px; box-shadow:var(--shadow-1);}
.section-title{font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px;}
.page-title{font-size:26px; margin-bottom:4px;}
.page-sub{color:var(--text-secondary); margin-bottom:22px; font-size:14.5px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 20px; border-radius:var(--radius-s); font-weight:700; font-size:14.5px;
  transition:transform .1s, opacity .15s, background .15s; white-space:nowrap;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-2);}
.btn-secondary{background:var(--surface-elevated); color:var(--text-primary); border:1px solid var(--border-strong);}
.btn-secondary:hover{background:var(--surface-hover);}
.btn-ghost{background:transparent; color:var(--text-secondary);}
.btn-ghost:hover{color:var(--text-primary);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-block{width:100%;}
.btn-lg{padding:16px 22px; font-size:15.5px; border-radius:var(--radius-m);}
.btn:disabled{opacity:.5; pointer-events:none;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:7px;}
.field input, .field select, .field textarea{
  width:100%; background:var(--surface-elevated); border:1px solid var(--border-strong); border-radius:var(--radius-s);
  padding:13px 14px; font-size:16px; color:var(--text-primary); outline:none; transition:border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field-error{color:var(--danger); font-size:12.5px; margin-top:6px; display:none;}
.field.error input{border-color:var(--danger);}
.field.error .field-error{display:block;}
.field-hint{font-size:12.5px; color:var(--text-muted); margin-top:6px;}

.chip{
  display:inline-flex; align-items:center; padding:9px 15px; border-radius:100px; font-size:13.5px; font-weight:600;
  background:var(--surface-elevated); border:1px solid var(--border); color:var(--text-secondary); white-space:nowrap;
}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px; scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.scroll-hint-wrap{position:relative;}
.scroll-fade{
  position:absolute; top:0; right:0; bottom:4px; width:44px; pointer-events:none;
  display:flex; align-items:center; justify-content:flex-end;
  background:linear-gradient(90deg, transparent, var(--bg) 65%);
  opacity:0; transition:opacity .25s;
}
.scroll-fade .icon{width:16px; height:16px; color:var(--text-muted); margin-right:2px;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:100px; font-size:11px; font-weight:700; letter-spacing:.03em;}
.badge-accent{background:var(--accent-soft); color:var(--accent);}
.badge-success{background:var(--success-soft); color:var(--success);}

.progress-track{height:8px; background:var(--surface-elevated); border:1px solid var(--border); border-radius:100px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:100px; transition:width .5s cubic-bezier(.2,.8,.2,1);}

.empty-state{text-align:center; padding:40px 20px; color:var(--text-secondary);}
.empty-state .icon{width:34px; height:34px; color:var(--text-muted); margin-bottom:12px;}
.empty-state h4{font-size:16px; margin-bottom:6px; color:var(--text-primary);}
.empty-state p{font-size:13.5px; margin-bottom:16px;}

.modal-overlay{position:fixed; inset:0; background:var(--overlay); display:flex; align-items:flex-end; justify-content:center; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s;}
.modal-overlay.open{opacity:1; pointer-events:auto;}
@media (min-width:640px){.modal-overlay{align-items:center;}}
.modal{
  background:var(--surface-elevated); border:1px solid var(--border); width:100%; max-width:420px;
  border-radius:22px 22px 0 0; padding:26px 22px 28px; transform:translateY(24px); transition:transform .25s cubic-bezier(.2,.8,.2,1);
  max-height:88vh; overflow-y:auto;
}
@media (min-width:640px){.modal{border-radius:var(--radius-l); transform:translateY(0) scale(.96);}}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal h3{font-size:19px; margin-bottom:8px;}
.modal p{color:var(--text-secondary); font-size:14px; margin-bottom:18px; line-height:1.55;}
.modal-actions{display:flex; flex-direction:column; gap:10px;}

.toast-wrap{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; pointer-events:none; padding:0 16px;}
.toast{
  background:var(--surface-elevated); border:1px solid var(--border-strong); color:var(--text-primary);
  padding:12px 18px; border-radius:100px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-2);
  display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(-10px); transition:all .25s;
  max-width:420px;
}
.toast.show{opacity:1; transform:translateY(0);}
.toast .icon{width:16px; height:16px; color:var(--accent);}

/* ============================================================ */
/* AUTH                                                           */
/* ============================================================ */
.auth-screen{min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;}
.auth-box{width:100%; max-width:380px;}
.auth-logo{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:30px;}
.auth-logo .brand-mark{width:52px; height:52px; margin-bottom:16px;}
.auth-logo h1{font-size:23px; margin-bottom:8px;}
.auth-logo p{color:var(--text-secondary); font-size:14.5px;}
.auth-switch{text-align:center; margin-top:18px; font-size:13.5px; color:var(--text-secondary);}
.auth-switch button{color:var(--accent); font-weight:700;}
.theme-toggle-corner{position:fixed; top:18px; right:18px;}

/* ============================================================ */
/* DASHBOARD                                                      */
/* ============================================================ */
.dash-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px;}
.dash-greeting{font-size:22px;}
.level-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
.level-pill{background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:12.5px; padding:5px 11px; border-radius:100px;}
.streak-pill{display:flex; align-items:center; gap:5px; font-weight:700; font-size:13px; color:var(--warning);}
.xp-bar-wrap{margin-top:10px;}
.xp-label{display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:6px; font-weight:600;}

.today-card{
  background:linear-gradient(155deg, var(--surface-elevated), var(--surface));
  border:1px solid var(--border); border-radius:var(--radius-l); padding:26px; margin-bottom:18px; position:relative; overflow:hidden;
}
.today-card::after{content:""; position:absolute; top:-60px; right:-60px; width:200px; height:200px; background:var(--accent); opacity:.08; border-radius:50%; filter:blur(10px);}
.today-eyebrow{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:10px;}
.today-title{font-size:25px; margin-bottom:6px;}
.today-meta{color:var(--text-secondary); font-size:14px; margin-bottom:20px;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:560px){.grid-2{grid-template-columns:1fr;}}
.stat-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-icon{width:38px; height:38px; border-radius:10px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0;}
.stat-text b{display:block; font-size:14.5px;}
.stat-text span{font-size:12.5px; color:var(--text-muted);}

.record-banner{display:flex; align-items:center; gap:14px; background:var(--surface-elevated); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px; margin-bottom:18px;}
.record-banner .icon-wrap{width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,#fbbf24,#f59e0b); display:flex; align-items:center; justify-content:center; color:#1a1200; flex-shrink:0;}

/* ============================================================ */
/* WORKOUT / EXERCISE LISTS                                      */
/* ============================================================ */
.workout-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:18px;
  display:flex; align-items:center; gap:14px; margin-bottom:12px; transition:border-color .15s, background .15s;
}
.workout-card:hover{border-color:var(--border-strong); background:var(--surface-hover);}
.workout-thumb{width:52px; height:52px; border-radius:12px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0;}
.workout-info{flex:1; min-width:0;}
.workout-info h4{font-size:15px; margin-bottom:3px;}
.workout-info span{font-size:12.5px; color:var(--text-muted);}

.grid-cat{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (min-width:640px){.grid-cat{grid-template-columns:repeat(3,1fr);}}
.cat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px;
  display:flex; flex-direction:column; align-items:flex-start; gap:20px; min-height:96px; transition:all .15s;
}
.cat-card:hover{background:var(--surface-hover); border-color:var(--border-strong);}
.cat-card .icon-wrap{width:36px; height:36px; border-radius:10px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; color:var(--accent);}
.cat-card span{font-weight:700; font-size:14px;}

.media-placeholder{
  width:100%; aspect-ratio:4/3; background:var(--surface-elevated); border:1px dashed var(--border-strong);
  border-radius:var(--radius-m); display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--text-muted); gap:8px; margin-bottom:18px;
}
.media-placeholder .icon{width:30px; height:30px;}
.media-placeholder span{font-size:12.5px; font-weight:600;}
.media-real{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:var(--radius-m); background:var(--surface-elevated); margin-bottom:18px; display:block;}
.media-thumb{width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--surface-elevated);}

.ex-row{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border);}
.ex-row:last-child{border-bottom:none;}
.ex-num{width:26px; height:26px; border-radius:8px; background:var(--surface-elevated); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-secondary); flex-shrink:0;}

/* ============================================================ */
/* WORKOUT SESSION                                                */
/* ============================================================ */
.session-view{max-width:520px; margin:0 auto; padding:20px 20px 40px;}
.session-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
.session-timer{font-family:var(--font-display); font-size:15px; font-weight:800; letter-spacing:.02em;}
.session-exit{color:var(--text-muted); font-size:13px; font-weight:600;}
.session-progress-label{font-size:12.5px; color:var(--text-muted); font-weight:600; margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em;}
.session-ex-name{font-size:24px; margin-bottom:18px;}
.set-info-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
.set-info-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px; text-align:center;}
.set-info-box label{display:block; font-size:11.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.set-info-box input{width:100%; text-align:center; font-size:22px; font-weight:800; font-family:var(--font-display); background:transparent; border:none; padding:0;}
.details-toggle{text-align:center; margin:6px 0 18px;}
.details-toggle button{font-size:13px; color:var(--accent); font-weight:700;}
.details-extra{display:none; margin-bottom:16px;}
.details-extra.open{display:block;}
.rest-picker{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.rest-chip{padding:8px 13px; border-radius:100px; background:var(--surface-elevated); border:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--text-secondary);}
.rest-chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.big-cta{width:100%; padding:20px; border-radius:18px; background:var(--accent); color:#fff; font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:10px;}
.big-cta:active{transform:scale(.98);}

.rest-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
.rest-ring-wrap{position:relative; width:220px; height:220px; margin-bottom:26px;}
.rest-ring-wrap svg{transform:rotate(-90deg);}
.rest-time{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:44px; font-weight:800;}

/* ============================================================ */
/* PROGRESS / CHARTS                                              */
/* ============================================================ */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px;}
@media (min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px;}
.stat-card b{display:block; font-family:var(--font-display); font-size:22px; margin-top:6px;}
.stat-card span{font-size:12px; color:var(--text-muted); font-weight:600;}
.chart-wrap{margin-top:6px;}
.chart-wrap svg{width:100%; height:140px; display:block;}

/* ============================================================ */
/* HISTORY / CALENDAR                                             */
/* ============================================================ */
.cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.cal-nav{display:flex; gap:6px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:8px;}
.cal-dow{text-align:center; font-size:11px; color:var(--text-muted); font-weight:700;}
.cal-day{
  aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:13px; font-weight:600; color:var(--text-secondary); background:var(--surface); border:1px solid transparent; position:relative;
}
.cal-day.empty{background:transparent;}
.cal-day.has-workout{background:var(--accent-soft); color:var(--accent); font-weight:800;}
.cal-day.today{border-color:var(--accent);}
.cal-day .dot{width:4px; height:4px; border-radius:50%; background:var(--accent); position:absolute; bottom:5px;}

/* ============================================================ */
/* EVORA+                                                         */
/* ============================================================ */
.plus-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media (min-width:560px){.plus-grid{grid-template-columns:repeat(3,1fr);}}
.plus-card{
  position:relative; aspect-ratio:2/3; border-radius:var(--radius-l); overflow:hidden; border:1px solid var(--border);
  display:flex; flex-direction:column; justify-content:flex-end; padding:16px; background-size:cover; background-position:center;
}
.plus-card::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.85) 100%);}
.plus-card-inner{position:relative; z-index:1;}
.plus-badge{display:inline-block; background:rgba(255,255,255,.15); backdrop-filter:blur(6px); color:#fff; font-size:10px; font-weight:800; letter-spacing:.05em; padding:4px 9px; border-radius:100px; margin-bottom:8px;}
.plus-card h4{color:#fff; font-size:14.5px; margin-bottom:3px;}
.plus-card p{color:rgba(255,255,255,.75); font-size:11.5px; line-height:1.4;}
.plus-lock{position:absolute; top:12px; right:12px; z-index:1; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.4); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; color:#fff;}

/* ============================================================ */
/* ACHIEVEMENTS                                                   */
/* ============================================================ */
.ach-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (min-width:640px){.ach-grid{grid-template-columns:repeat(3,1fr);}}
.ach-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:18px; text-align:center;}
.ach-card.locked{opacity:.45;}
.ach-icon{width:46px; height:46px; border-radius:14px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 10px;}
.ach-card.locked .ach-icon{background:var(--surface-elevated); color:var(--text-muted);}
.ach-card h5{font-size:13px; margin-bottom:3px;}
.ach-card span{font-size:11px; color:var(--text-muted);}

/* ============================================================ */
/* SETTINGS                                                       */
/* ============================================================ */
.settings-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row-text b{display:block; font-size:14px;}
.settings-row-text span{font-size:12.5px; color:var(--text-muted);}
.switch{width:44px; height:26px; border-radius:100px; background:var(--surface-elevated); border:1px solid var(--border-strong); position:relative; transition:background .15s; flex-shrink:0;}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--text-muted); transition:transform .2s, background .2s;}
.switch.on{background:var(--accent); border-color:var(--accent);}
.switch.on::after{transform:translateX(18px); background:#fff;}
.seg-control{display:flex; background:var(--surface-elevated); border:1px solid var(--border); border-radius:100px; padding:3px; gap:2px;}
.seg-btn{flex:1; text-align:center; padding:8px 10px; border-radius:100px; font-size:13px; font-weight:700; color:var(--text-secondary);}
.seg-btn.active{background:var(--accent); color:#fff;}

/* ============================================================ */
/* SUPPORT                                                        */
/* ============================================================ */
.support-card{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px; margin-bottom:12px;}
.support-card .icon-wrap{width:40px; height:40px; border-radius:11px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

/* onboarding */
.ob-progress{display:flex; gap:6px; margin-bottom:24px;}
.ob-progress div{flex:1; height:4px; border-radius:100px; background:var(--border);}
.ob-progress div.done{background:var(--accent);}
.option-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.option-card{
  padding:16px; border-radius:var(--radius-m); border:1.5px solid var(--border); background:var(--surface);
  font-weight:700; font-size:13.5px; text-align:left; transition:all .15s;
}
.option-card.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
</style>

    return `<img class="media-real" style="aspect-ratio:${aspect};" src="${e.gif}" alt="${e.name}">`;
  }
  if(e.image){
    return `<img class="media-real" style="aspect-ratio:${aspect};" src="${e.image}" alt="${e.name}">`;
  }
  return `<div class="media-placeholder" style="aspect-ratio:${aspect};">${icon('play-circle')}<span>Demonstração do exercício</span></div>`;
}

/* ===== AUTH FUNCTIONS ===== */
function emailValid(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

function signup(name, email, password){
  const users = loadUsers();
  const key = email.trim().toLowerCase();
  if(users[key]) return {ok:false, error:'Este e-mail já possui uma conta no EVORA FIT.'};
  users[key] = {name:name.trim(), email:key, password, createdAt:Date.now()};
  saveUsers(users);
  saveUserData(key, defaultUserData());
  setCurrentUserEmail(key);
  return {ok:true};
}
function login(email, password){
  const users = loadUsers();
  const key = email.trim().toLowerCase();
  const u = users[key];
  if(!u) return {ok:false, error:'Não encontramos uma conta com este e-mail.'};
  if(u.password !== password) return {ok:false, error:'E-mail ou senha incorretos.'};
  setCurrentUserEmail(key);
  return {ok:true};
}
function logout(){ setCurrentUserEmail(null); currentEmail=null; userData=null; renderRoot(); }

/* ================================================================ */
/* ===== XP / LEVEL / RECORDS / ACHIEVEMENTS ===== */
/* ================================================================ */
function xpThresholds(){
  let arr=[0]; let inc=1000;
  for(let i=1;i<=50;i++){ arr.push(arr[i-1]+inc); inc+=150; }
  return arr;
}
const XP_THRESHOLDS = xpThresholds();
function levelFromXP(xp){
  let lvl=1;
  for(let i=1;i<XP_THRESHOLDS.length;i++){ if(xp>=XP_THRESHOLDS[i]) lvl=i+1; else break; }
  return lvl;
}
function xpProgress(xp){
  const lvl = levelFromXP(xp);
  const base = XP_THRESHOLDS[lvl-1];
  const next = XP_THRESHOLDS[lvl] || (base+2000);
  return {level:lvl, current:xp-base, needed:next-base, xp};
}
function addXP(amount){ userData.xp += amount; }

function todayISO(){ return new Date().toISOString().slice(0,10); }
function isYesterday(iso){
  if(!iso) return false;
  const d = new Date(iso+'T00:00:00'); const y = new Date(); y.setDate(y.getDate()-1);
  return d.toDateString() === y.toDateString();
}
function isToday(iso){ return iso === todayISO(); }

function updateStreak(){
  if(isToday(userData.lastWorkoutISO)) return; // already counted today
  if(isYesterday(userData.lastWorkoutISO)) userData.streak += 1;
  else userData.streak = 1;
  userData.lastWorkoutISO = todayISO();
}

function detectPR(exerciseId, weight, reps){
  if(!weight || weight<=0) return null;
  const prior = userData.records.filter(r=>r.exerciseId===exerciseId).sort((a,b)=>b.weight-a.weight)[0];
  if(!prior || weight > prior.weight){
    const record = {exerciseId, weight, reps, date:todayISO()};
    userData.records.push(record);
    return {record, previous:prior};
  }
  return null;
}

function checkAchievements(){
  const newly = [];
  achievementDefs.forEach(a=>{
    if(!userData.unlockedAchievements.includes(a.id) && a.check(userData)){
      userData.unlockedAchievements.push(a.id);
      newly.push(a);
    }
  });
  return newly;
}

function exerciseById(id){ return exercises.find(e=>e.id===id); }
function allWorkouts(){ return workouts.concat(userData.customWorkouts); }
function workoutById(id){ return allWorkouts().find(w=>w.id===id); }

let route = {view:'dashboard', params:{}};
let drawerOpen = false;
let sessionState = null; // active workout session
let uiTmp = {}; // scratch for forms (build workout, onboarding, etc)
let uiFilters = { workoutFilter:'Todos', exObj:'Todos', exEquip:'Todos', historyMuscle:'Todos', historyPeriod:'todos', calMonth:new Date().getMonth(), calYear:new Date().getFullYear() };

function navigate(view, params){
  route = {view, params: params||{}};
  drawerOpen = false;
  window.scrollTo(0,0);
  persistRoute();
  renderApp();
}

function renderRoot(){
  currentEmail = getCurrentUserEmail();
  const app = document.getElementById('app');
  if(!currentEmail){
    app.innerHTML = renderAuthLogin();
    bindAuthEvents();
    refreshIcons();
    return;
  }
  userData = getUserData(currentEmail);
  const users = loadUsers();
  const userRecord = users[currentEmail];
  const savedFilters = loadPersistedFilters();
  if(savedFilters) uiFilters = Object.assign(uiFilters, savedFilters);

  if(!userData.onboardingDone){
    route = {view:'onboarding', params:{step:1}};
  } else {
    // Restore where the user left off (survives refresh)
    const savedRoute = loadPersistedRoute();
    if(savedRoute && savedRoute.view && savedRoute.view!=='onboarding' && savedRoute.view!=='login' && savedRoute.view!=='signup'){
      route = savedRoute;
      if(route.view==='session' || route.view==='rest'){
        const savedSession = loadPersistedSession();
        if(savedSession && savedSession.workoutId && workoutById(savedSession.workoutId)){
          sessionState = savedSession;
        } else {
          route = {view:'dashboard', params:{}};
        }
      }
    } else {
      route = {view:'dashboard', params:{}};
    }
  }
  renderApp();
}

function userName(){
  const users = loadUsers();
  return (users[currentEmail] && users[currentEmail].name) || 'Atleta';
}

function renderApp(){
  const app = document.getElementById('app');
  // Resolve any invalid session/rest route *before* rendering, so a render
  // function never has to call navigate() on itself mid-render.
  if((route.view==='session' || route.view==='rest') && (!sessionState || !workoutById(sessionState.workoutId))){
    sessionState = null; persistSession();
    route = {view:'dashboard', params:{}}; persistRoute();
  } else if(route.view==='rest' && sessionState && !sessionState.rest){
    route = {view:'session', params:{}}; persistRoute();
  }
  if(route.view==='onboarding'){
    app.innerHTML = renderOnboarding();
    bindOnboardingEvents();
    refreshIcons();
    return;
  }
  if(route.view==='session'){
    app.innerHTML = renderSession() + renderModalHost();
    bindSessionEvents();
    bindModalEvents();
    refreshIcons();
    return;
  }
  if(route.view==='rest'){
    app.innerHTML = renderRest() + renderModalHost();
    bindRestEvents();
    bindModalEvents();
    refreshIcons();
    return;
  }
  app.innerHTML = renderShell();
  refreshIcons();
  bindShellEvents();
  initScrollHints();
}

    if(!email || !emailValid(email)){ document.getElementById('signupEmail').parentElement.classList.add('error'); document.getElementById('signupEmailErr').textContent='Informe um e-mail válido.'; hasErr=true; }

function bindOnboardingEvents(){
  const step = (route.params && route.params.step) || 1;
  if(step===1){
    document.querySelectorAll('[data-sexo]').forEach(b=> b.onclick = ()=>{
      uiTmp.onboard.sexo = b.getAttribute('data-sexo');
      document.querySelectorAll('[data-sexo]').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
    document.getElementById('obNext1').onclick = ()=>{
      const idade = document.getElementById('obIdade').value;
      const peso = document.getElementById('obPeso').value;
      const altura = document.getElementById('obAltura').value;
      if(!idade || !peso || !altura || !uiTmp.onboard.sexo){
        toast('Preencha todos os campos para continuar.', 'alert-circle'); return;
      }
      uiTmp.onboard.idade = idade; uiTmp.onboard.peso = peso; uiTmp.onboard.altura = altura;
      navigate('onboarding', {step:2});
    };
  } else {
    document.querySelectorAll('[data-obj]').forEach(b=> b.onclick = ()=>{
      uiTmp.onboard.objetivo = b.getAttribute('data-obj');
      document.querySelectorAll('[data-obj]').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
    document.getElementById('obBack').onclick = ()=> navigate('onboarding', {step:1});
    document.getElementById('obFinish').onclick = ()=>{
      if(!uiTmp.onboard.objetivo){ toast('Escolha um objetivo para continuar.', 'alert-circle'); return; }
      userData.profile = Object.assign({}, uiTmp.onboard);
      userData.onboardingDone = true;
      persist();
      uiTmp.onboard = null;
      toast('Tudo pronto. Vamos começar sua evolução.', 'sparkles');
      route = {view:'dashboard', params:{}};
      renderApp();
    };
  }
}

function startOfWeek(d){ const nd=new Date(d); const day=nd.getDay(); nd.setHours(0,0,0,0); nd.setDate(nd.getDate()-day); return nd; }

/* ===== SCROLL HINT (indica que a lista horizontal pode ser arrastada) ===== */
/* ================================================================ */
let scrollHintCounter = 0;
function scrollHint(innerHtml){
  const id = 'sh'+(scrollHintCounter++);
  return `<div class="scroll-hint-wrap"><div class="chip-row" id="${id}">${innerHtml}</div><div class="scroll-fade" data-fade-for="${id}">${icon('chevron-right')}</div></div>`;
}
function initScrollHints(){
  document.querySelectorAll('[data-fade-for]').forEach(fade=>{
    const rowId = fade.getAttribute('data-fade-for');
    const row = document.getElementById(rowId);
    if(!row) return;
    const update = ()=>{
      const overflowing = row.scrollWidth > row.clientWidth + 4;
      const atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      fade.style.opacity = (overflowing && !atEnd) ? '1' : '0';
    };
    update();
    row.addEventListener('scroll', update, {passive:true});
    window.addEventListener('resize', update);
  });
}

  const cats = ['Todos'].concat(WORKOUT_CATEGORIES);
  const list = allWorkouts().filter(w=>{
    if(uiFilters.workoutFilter==='Todos') return true;
    return (w.category && w.category.includes(uiFilters.workoutFilter)) || w.muscle===muscleIdFor(uiFilters.workoutFilter) || (uiFilters.workoutFilter==='Full Body' && w.id==='w-fullbody');
  });
  return `
  <h1 class="page-title">Treinos</h1>
  <p class="page-sub">Explore treinos por categoria ou grupo muscular.</p>
  ${scrollHint(cats.map(c=>`<button class="chip ${uiFilters.workoutFilter===c?'active':''}" data-wf="${c}">${c}</button>`).join(''))}

function muscleIdFor(catLabel){
  const map={'Peito':'peito','Costas':'costas','Ombros':'ombros','Braços':'biceps','Pernas':'quadriceps','Glúteos':'gluteos','Abdômen':'abdomen'};
  return map[catLabel];

/* ===== WORKOUT SESSION (execução) ===== */

const REST_QUICK_OPTIONS = [30,45,60,90,120,180];
function currentWorkout(){ return sessionState ? workoutById(sessionState.workoutId) : null; }
function getRestForExercise(exIdx){
  if(!sessionState) return userData.restDefault;
  const w = currentWorkout();
  if(sessionState.restOverrides && sessionState.restOverrides[exIdx]!=null) return sessionState.restOverrides[exIdx];
  if(sessionState.restDefaultOverride!=null) return sessionState.restDefaultOverride;
  return (w.exercises[exIdx] && w.exercises[exIdx].rest) || userData.restDefault;
}

function startWorkoutSession(workoutId){
  const w = workoutById(workoutId);
  if(!w) return;
  sessionState = {
    workoutId:w.id, phase:'preview', exIndex:0, setIndex:0, startedAt:null,
    log: w.exercises.map(ex=>({exerciseId:ex.exerciseId, sets:[]})),
    detailsOpen:false, restOverrides:{}, restDefaultOverride:null, rest:null,
    draft:{reps:null, weight:'', notes:''}
  };
  persistSession();
  navigate('session', {});
}

/* ----- PRE-START (preview) ----- */
function renderSessionPreview(){
  const s = sessionState; const w = currentWorkout();

  const currentRest = s.restDefaultOverride != null ? s.restDefaultOverride : userData.restDefault;
  return `
  <div class="session-view">
    <div class="session-top">

      <div class="session-timer" style="opacity:.4;">${fmtTime(0)}</div>
    </div>
    <div class="session-progress-label">${(w.muscle||'').toUpperCase()} — ${w.name.toUpperCase()}</div>
    ${renderExerciseMedia(firstEx, '16/10')}
    <h1 style="font-size:24px; margin-bottom:4px;">${w.name}</h1>
    <p class="muted" style="margin-bottom:20px; font-size:14px;">${w.exercises.length} exercícios · aproximadamente ${w.duration} min</p>

    <div class="card" style="margin-bottom:18px;">
      ${w.exercises.map((ex,i)=>{
        const e = exerciseById(ex.exerciseId);
        const thumb = exerciseThumbHtml(e);
        return `<div class="ex-row">${thumb || `<div class="ex-num">${i+1}</div>`}<div style="flex:1;"><b style="font-size:14px;">${e?e.name:ex.exerciseId}</b><div class="faint" style="font-size:12.5px;">${ex.sets} séries × ${ex.reps} reps · descanso ${ex.rest||userData.restDefault}s</div></div></div>`;
      }).join('')}
    </div>

    <div class="section-title">Tempo de descanso padrão</div>
    <div class="rest-picker" id="previewRestPicker" style="margin-bottom:22px;">
      ${REST_QUICK_OPTIONS.map(t=>`<button class="rest-chip ${currentRest===t?'active':''}" data-preview-rest="${t}">${t<60?t+'s':(t/60)+'min'}</button>`).join('')}
      <button class="rest-chip" id="previewRestCustomBtn">Personalizar</button>
    </div>
    <div id="previewRestCustomWrap" class="hidden" style="margin:-14px 0 22px; display:flex; gap:8px;">
      <input type="number" id="previewRestCustomInput" placeholder="Segundos" style="flex:1; background:var(--surface-elevated); border:1px solid var(--border-strong); border-radius:var(--radius-s); padding:12px 14px;">
      <button class="btn btn-secondary" id="previewRestCustomOk">OK</button>
    </div>

    <button class="big-cta" id="startWorkoutBtn">${icon('play')} Iniciar treino</button>
  </div>`;
}

function renderSession(){
  if(!sessionState) return '';
  if(sessionState.phase==='preview') return renderSessionPreview();
  const s = sessionState; const w = currentWorkout();
  if(!w) return '';
  const exDef = w.exercises[s.exIndex];
  const e = exerciseById(exDef.exerciseId);
  const elapsed = Math.floor((Date.now()-s.startedAt)/1000);
  const currentRest = getRestForExercise(s.exIndex);
  const draft = s.draft || {reps:null, weight:'', notes:''};

  return `
  <div class="session-view">
    <div class="session-top">
      <button class="session-exit" id="exitSession">${icon('x')} Sair</button>
      <div class="session-timer" id="sessionTimer">${fmtTime(elapsed)}</div>
    </div>
    <div class="session-progress-label">${(w.muscle||'').toUpperCase()} — ${w.name.toUpperCase()}</div>
    ${renderExerciseMedia(e, '16/10')}
    <div class="session-ex-name">${e ? e.name : exDef.exerciseId}</div>
    <div class="faint" style="margin-bottom:16px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;">Série ${s.setIndex+1} de ${exDef.sets}</div>

    <div class="set-info-grid">
      <div class="set-info-box"><label>Repetições</label><input type="number" id="setReps" value="${draft.reps!=null?draft.reps:exDef.reps}"></div>
      <div class="set-info-box"><label>Carga (kg)</label><input type="number" id="setWeight" placeholder="0" value="${draft.weight||''}"></div>
    </div>

    <div class="section-title">Tempo de descanso</div>
    <div class="rest-picker" id="sessionRestPicker" style="margin-bottom:14px;">
      ${REST_QUICK_OPTIONS.map(t=>`<button class="rest-chip ${currentRest===t?'active':''}" data-rest-choice="${t}">${t<60?t+'s':(t/60)+'min'}</button>`).join('')}
      <button class="rest-chip" id="restCustomBtn">Personalizar</button>
    </div>
    <div id="restCustomWrap" class="hidden" style="margin:-6px 0 14px; display:flex; gap:8px;">
      <input type="number" id="restCustomInput" placeholder="Segundos" style="flex:1; background:var(--surface-elevated); border:1px solid var(--border-strong); border-radius:var(--radius-s); padding:12px 14px;">
      <button class="btn btn-secondary" id="restCustomOk">OK</button>
    </div>

    <div class="details-toggle"><button id="toggleDetails">+ Adicionar detalhes</button></div>
    <div class="details-extra ${s.detailsOpen?'open':''}" id="detailsExtra">
      <div class="field"><label>Observações</label><textarea id="setNotes" rows="2" placeholder="Ex: senti mais controle na descida">${draft.notes||''}</textarea></div>
    </div>

    <button class="big-cta" id="completeSetBtn">${icon('check')} Concluir série</button>
    <button class="btn btn-ghost btn-block" id="finishEarlyBtn" style="margin-top:10px;">Finalizar treino</button>
  </div>`;
}
function fmtTime(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return (h>0? String(h).padStart(2,'0')+':':'') + String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
let sessionTimerHandle=null;
function bindSessionEvents(){
  clearInterval(sessionTimerHandle);
  if(!sessionState) return;
  if(sessionState.phase==='preview'){ bindSessionPreviewEvents(); return; }

  sessionTimerHandle = setInterval(()=>{
    const el = document.getElementById('sessionTimer');
    if(!el || !sessionState || sessionState.phase!=='active'){ clearInterval(sessionTimerHandle); return; }
    el.textContent = fmtTime(Math.floor((Date.now()-sessionState.startedAt)/1000));
  },1000);

  document.getElementById('exitSession').onclick = confirmExitWorkout;
  document.getElementById('finishEarlyBtn').onclick = ()=>{
    openModal(`<h3>Finalizar treino agora?</h3><p>As séries já registradas serão salvas no seu histórico. Séries restantes não serão contabilizadas.</p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="confirmFinishEarly">Finalizar treino</button>
      <button class="btn btn-ghost" id="cancelExit">Continuar treinando</button>
    </div>`);
  };
  document.getElementById('toggleDetails').onclick = ()=>{
    sessionState.detailsOpen = !sessionState.detailsOpen;
    document.getElementById('detailsExtra').classList.toggle('open');
    persistSession();
  };
  document.querySelectorAll('[data-rest-choice]').forEach(b=> b.onclick = ()=>{
    sessionState.restOverrides[sessionState.exIndex] = parseInt(b.getAttribute('data-rest-choice'));
    persistSession();
    renderApp();
  });
  document.getElementById('restCustomBtn').onclick = ()=> document.getElementById('restCustomWrap').classList.toggle('hidden');
  document.getElementById('restCustomOk').onclick = ()=>{

function completeCurrentSet(){
  const s = sessionState; const w = currentWorkout(); const exDef = w.exercises[s.exIndex];
  const reps = parseInt(document.getElementById('setReps').value)||0;
  const weight = parseFloat(document.getElementById('setWeight').value)||0;
  const notesEl = document.getElementById('setNotes');
  const notes = notesEl ? notesEl.value : '';
  s.log[s.exIndex].sets.push({reps, weight, notes});
  s.draft = {reps:null, weight:'', notes:''};
  toast('Série concluída','check-circle');

  const isLastSet = s.setIndex >= exDef.sets-1;
  const isLastExercise = s.exIndex >= w.exercises.length-1;

  if(!isLastSet){
    s.setIndex += 1;
    enterRest(s.exIndex);
  } else if(!isLastExercise){
    s.exIndex += 1; s.setIndex = 0; s.detailsOpen=false;
    enterRest(s.exIndex);

  }

function finishWorkout(){

  const durationSec = Math.floor((Date.now()-s.startedAt)/1000);
  const historyEntry = {

  let totalSets=0; s.log.forEach(l=> totalSets+=l.sets.length);
  const xpGain = 40 + historyEntry.exercises.length*10 + totalSets*5;
  addXP(xpGain);

  updateStreak();

  const newRecords = [];
  s.log.forEach(l=>{
    l.sets.forEach(set=>{
      const pr = detectPR(l.exerciseId, set.weight, set.reps);
      if(pr) newRecords.push(pr);
    });

  newRecords.forEach(()=> addXP(200));

  const newAchievements = checkAchievements();

  sessionState = null;

/* ===== REST SCREEN (persistente via timestamp) ===== */
let restHandle = null;
/* ================================================================ */
/* ===== NOTIFICAÇÕES: separação clara entre as camadas ===== */
/* Timer do treino (relógio) → evento "descanso finalizado" (UI) →
   disparo da notificação → Service Worker / Push.
   O agendamento é feito no INÍCIO do descanso (não no fim), delegado ao
   Service Worker via postMessage, para que a notificação nativa do
   sistema consiga aparecer mesmo com a aba em segundo plano ou fechada
   — dentro do que o navegador permite sem um servidor de push real (ver
   nota no bloco setupPWA mais abaixo). */
/* ================================================================ */
let swRegistration = null;
let fallbackNotifyHandle = null;
function postToSW(message){
  if(!('serviceWorker' in navigator)) return false;
  if(navigator.serviceWorker.controller){ navigator.serviceWorker.controller.postMessage(message); return true; }
  if(swRegistration && swRegistration.active){ swRegistration.active.postMessage(message); return true; }
  return false;
}
function scheduleRestNotification(endAt){
  clearTimeout(fallbackNotifyHandle);
  if(!userData.notifications.rest) return;
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const payload = {
    type:'SCHEDULE_REST_NOTIFICATION', endAt,
    title:'EVORA FIT', body:'🏋️ Descanso finalizado! Seu descanso acabou. Hora da próxima série.',
    icon: FAVICON_DATA_URL
  };
  const sentToSW = postToSW(payload);
  if(!sentToSW){
    // Sem Service Worker disponível: melhor esforço possível a partir da própria página
    // (só dispara enquanto a aba estiver aberta — não é uma notificação em segundo plano real).
    const delay = Math.max(0, endAt-Date.now());
    fallbackNotifyHandle = setTimeout(()=>{ try{ new Notification(payload.title, {body:payload.body, icon:payload.icon}); }catch(e){} }, delay);
  }
}
function cancelRestNotification(){
  postToSW({type:'CANCEL_REST_NOTIFICATION'});
  clearTimeout(fallbackNotifyHandle);
}

function enterRest(nextExIndex){
  const restSec = getRestForExercise(nextExIndex);
  sessionState.rest = { duration:restSec, endAt: Date.now()+restSec*1000, paused:false, remainingMs:null };
  persistSession();
  scheduleRestNotification(sessionState.rest.endAt);
  navigate('rest', {});
}
function restRemainingSec(){
  const r = sessionState.rest;
  if(!r) return 0;
  if(r.paused) return Math.max(0, Math.ceil(r.remainingMs/1000));
  return Math.max(0, Math.ceil((r.endAt - Date.now())/1000));
}
function renderRest(){
  const s = sessionState;
  if(!s || !s.rest) return '';
  const remaining = restRemainingSec();
  const circumference = 2*Math.PI*100;
  const finished = remaining<=0;
  return `
  <div class="rest-screen">
    <div class="today-eyebrow" style="margin-bottom:6px;">${finished?'':'Descanso'}</div>
    <div class="rest-ring-wrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="100" fill="none" stroke="var(--border)" stroke-width="10"/>
        <circle id="restRing" cx="110" cy="110" r="100" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="0"/>
      </svg>
      <div class="rest-time" id="restTimeLabel">${finished?icon('check'):fmtTime(remaining)}</div>
    </div>
    <p class="muted" id="restStatusText" style="margin-bottom:20px; font-weight:${finished?'700':'400'}; color:${finished?'var(--success)':'var(--text-secondary)'};">${finished?'DESCANSO FINALIZADO':'Hora da próxima série.'}</p>
    <div class="grid-2" style="width:100%; max-width:320px; margin-bottom:12px; gap:10px;" id="restControlsRow">
      <button class="btn btn-secondary" id="restMinus10">−10s</button>
      <button class="btn btn-secondary" id="restPlus10">+10s</button>
    </div>
    <button class="btn btn-secondary btn-block" style="max-width:320px; margin-bottom:10px;" id="restPauseToggle">${s.rest.paused?'Continuar':'Pausar'}</button>
    <button class="btn btn-primary btn-lg" id="skipRest">${finished?'Continuar':'Encerrar descanso'}</button>
    <button class="session-exit" id="exitFromRest" style="margin-top:18px;">${icon('x')} Sair do treino</button>
  </div>`;
}
function bindRestEvents(){
  clearInterval(restHandle);
  if(!sessionState || !sessionState.rest) return;
  const circumference = 2*Math.PI*100;

  function tick(){
    const ring = document.getElementById('restRing');
    const label = document.getElementById('restTimeLabel');
    const statusText = document.getElementById('restStatusText');
    const skipBtn = document.getElementById('skipRest');
    if(!ring || !sessionState || !sessionState.rest){ clearInterval(restHandle); return; }
    const remaining = restRemainingSec();
    const pct = Math.max(0, remaining/sessionState.rest.duration);
    ring.setAttribute('stroke-dashoffset', String(circumference*(1-pct)));
    if(remaining<=0){
      clearInterval(restHandle);
      label.innerHTML = icon('check');
      statusText.textContent = 'DESCANSO FINALIZADO';
      statusText.style.fontWeight='700'; statusText.style.color='var(--success)';
      if(skipBtn) skipBtn.textContent='Continuar';
      toast('🔔 Descanso finalizado — hora da próxima série.', 'bell');
      return;
    }
    label.textContent = fmtTime(remaining);
  }
  if(!sessionState.rest.paused) restHandle = setInterval(tick, 500);
  tick();

  document.getElementById('skipRest').onclick = ()=>{
    clearInterval(restHandle);
    cancelRestNotification();
    sessionState.rest = null;
    persistSession();
    navigate('session', {});
  };
  document.getElementById('restPauseToggle').onclick = ()=>{
    const r = sessionState.rest;
    if(!r.paused){
      r.remainingMs = Math.max(0, r.endAt - Date.now());
      r.paused = true;
      clearInterval(restHandle);
      cancelRestNotification();
    } else {
      r.endAt = Date.now() + r.remainingMs;
      r.paused = false;
      restHandle = setInterval(tick, 500);
      scheduleRestNotification(r.endAt);
    }
    persistSession();
    renderApp();
  };
  document.getElementById('restPlus10').onclick = ()=>{
    const r = sessionState.rest;
    if(r.paused) r.remainingMs += 10000; else { r.endAt += 10000; scheduleRestNotification(r.endAt); }
    r.duration += 10;
    persistSession();
    tick();
  };
  document.getElementById('restMinus10').onclick = ()=>{
    const r = sessionState.rest;
    if(r.paused) r.remainingMs = Math.max(0, r.remainingMs-10000); else { r.endAt = Math.max(Date.now(), r.endAt-10000); scheduleRestNotification(r.endAt); }
    persistSession();
    tick();
  };
  document.getElementById('exitFromRest').onclick = confirmExitWorkout;
}

  <div class="section-title">Peso corporal</div>

      <div><span class="faint" style="font-size:12px; font-weight:700; text-transform:uppercase;">Peso atual</span><div style="font-family:var(--font-display); font-size:22px; font-weight:800;">${currentWeight} kg</div></div>
      <button class="btn btn-secondary" id="registerWeightBtn">Registrar peso</button>
    </div>
    ${weightData.length>1 ? `<div class="chart-wrap">${lineChart(weightData.map(w=>w.weight))}</div>` : ''}
  </div>
  `;
}
function volumeByWeek(){
  const map = {};
  userData.history.forEach(h=>{
    const d = new Date(h.date); const ws = startOfWeek(d); const key = ws.toISOString().slice(0,10);
    map[key] = (map[key]||0)+1;
  });
  const keys = Object.keys(map).sort().slice(-8);
  return keys.map(k=>map[k]);
}
function barChart(data){
  if(!data.length) data=[0];
  const max = Math.max(...data, 1);
  const w=300, h=120, bw = w/data.length;
  const bars = data.map((v,i)=>{
    const bh = (v/max)*(h-16);
    return `<rect x="${i*bw+bw*0.2}" y="${h-bh}" width="${bw*0.6}" height="${bh}" rx="4" fill="var(--accent)"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg>`;
}
function lineChart(data){
  const w=300, h=120; const max=Math.max(...data), min=Math.min(...data);
  const range = (max-min)||1;
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h-10 - ((v-min)/range)*(h-20);
    return `${x},${y}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ===== HISTORY / CALENDAR ===== */
/* ================================================================ */
const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const HISTORY_MUSCLE_LABELS = {'Todos':null,'Peito':'peito','Costas':'costas','Ombros':'ombros','Braços':'biceps','Pernas':'quadriceps','Glúteos':'gluteos','Abdômen':'abdomen'};

function historyMatchesMuscle(h){
  const target = HISTORY_MUSCLE_LABELS[uiFilters.historyMuscle];
  if(!target) return true;
  return h.muscleGroup === target;
}
function historyInPeriod(h){
  const period = uiFilters.historyPeriod;
  if(period==='todos') return true;
  const d = new Date(h.date+'T00:00:00');
  const now = new Date();
  if(period==='hoje') return h.date===todayISO();
  if(period==='semana') return d >= startOfWeek(now);
  if(period==='mes') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  if(period==='custom' && uiFilters.historyCustomFrom && uiFilters.historyCustomTo){
    return h.date >= uiFilters.historyCustomFrom && h.date <= uiFilters.historyCustomTo;
  }
  return true;
}

function renderHistory(){
  const calMonth = uiFilters.calMonth, calYear = uiFilters.calYear;
  const first = new Date(calYear, calMonth, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const historyByDate = {};
  userData.history.forEach(h=>{ (historyByDate[h.date] = historyByDate[h.date]||[]).push(h); });

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEntries = (historyByDate[iso]||[]).filter(historyMatchesMuscle);
    const has = dayEntries.length>0;
    const isToday_ = iso===todayISO();
    cells += `<div class="cal-day ${has?'has-workout':''} ${isToday_?'today':''}" data-cal-day="${iso}">${d}${has?'<div class="dot"></div>':''}</div>`;
  }

  const selDate = route.params.date;
  let detailHtml = '';
  if(selDate){
    const entries = (historyByDate[selDate]||[]).filter(historyMatchesMuscle);
    if(entries.length){
      detailHtml = entries.map(h=>`
        <div class="card" style="margin-top:16px;">
          <div class="section-title">${formatDateLong(selDate)}</div>
          <h3 style="font-size:17px; margin-bottom:4px;">${h.workoutName}</h3>
          <p class="faint" style="font-size:13px; margin-bottom:14px;">${Math.round(h.durationSec/60)} min · ${h.exercises.length} exercícios · ${h.exercises.reduce((a,e)=>a+e.sets.length,0)} séries</p>
          ${h.exercises.map(e=>`<div class="ex-row"><div style="flex:1;"><b style="font-size:13.5px;">${e.name}</b></div><span class="faint" style="font-size:12.5px;">${e.sets.map(s=> s.weight? (s.weight+'kg × '+s.reps) : (s.reps+' reps')).join(' · ')}</span></div>`).join('')}
        </div>`).join('');
    } else {
      detailHtml = `<div class="card" style="margin-top:16px;"><p class="muted">Nenhum treino registrado neste dia.</p></div>`;
    }
  }

  const periodOptions = [['todos','Todos'],['hoje','Hoje'],['semana','Esta semana'],['mes','Este mês'],['custom','Personalizado']];
  const periodListEntries = uiFilters.historyPeriod!=='todos' && !selDate
    ? userData.history.filter(h=>historyInPeriod(h) && historyMatchesMuscle(h)).sort((a,b)=> new Date(b.date)-new Date(a.date))
    : [];

  return `
  <h1 class="page-title">Histórico</h1>
  <div class="section-title">Período</div>
  ${scrollHint(periodOptions.map(([val,label])=>`<button class="chip ${uiFilters.historyPeriod===val?'active':''}" data-hp="${val}">${label}</button>`).join(''))}
  <div class="section-title">Grupo muscular</div>
  ${scrollHint(['Todos','Peito','Costas','Pernas','Ombros','Braços','Glúteos','Abdômen'].map(c=>`<button class="chip ${uiFilters.historyMuscle===c?'active':''}" data-hf="${c}">${c}</button>`).join(''))}
  <div class="card">
    <div class="cal-header">
      <b>${MONTH_NAMES[calMonth]} ${calYear}</b>
      <div class="cal-nav">
        <button class="icon-btn" id="calPrev">${icon('chevron-left')}</button>
        <button class="icon-btn" id="calNext">${icon('chevron-right')}</button>
      </div>
    </div>
    <div class="cal-grid">${['D','S','T','Q','Q','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>
  ${detailHtml}
  ${periodListEntries.length ? `
    <div class="section-title" style="margin-top:20px;">Treinos no período</div>
    ${periodListEntries.map(h=>`<button class="workout-card" data-jump-date="${h.date}" style="width:100%;"><div class="workout-thumb">${icon('calendar')}</div><div class="workout-info"><h4>${h.workoutName}</h4><span>${formatDateLong(h.date)} · ${Math.round(h.durationSec/60)} min</span></div>${icon('chevron-right')}</button>`).join('')}
  ` : (uiFilters.historyPeriod!=='todos' && !selDate ? `<div class="empty-state">${icon('calendar-x')}<h4>Nenhum treino neste período.</h4><p>Ajuste o filtro ou escolha outro intervalo.</p></div>` : '')}
  `;
}
function formatDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  return `${d.getDate()} de ${MONTH_NAMES[d.getMonth()].toLowerCase()}`;
}

    <button class="btn btn-ghost" id="modalCancel">Agora não</button>
  </div>`;
}

/* ================================================================ */
/* ===== SETTINGS ===== */
/* ================================================================ */
function renderSettings(){
  const themePref = localStorage.getItem(STORAGE_KEYS.theme) || 'dark';
  const p = userData.profile;
  const users = loadUsers();
  const uRec = users[currentEmail];
  return `
  <h1 class="page-title">Configurações</h1>

  <div class="section-title">Aparência</div>
  <div class="card" style="margin-bottom:18px;">
    <div class="seg-control">
      <button class="seg-btn ${themePref==='system'?'active':''}" data-theme-pref="system">Sistema</button>
      <button class="seg-btn ${themePref==='light'?'active':''}" data-theme-pref="light">Claro</button>
      <button class="seg-btn ${themePref==='dark'?'active':''}" data-theme-pref="dark">Escuro</button>
    </div>
  </div>

  <div class="section-title">Notificações</div>
  <div class="card" style="margin-bottom:18px;">
    ${renderNotificationPermissionBanner()}
    ${notifRow('rest','Descanso finalizado')}
    ${notifRow('reminder','Lembrete de treino')}
    ${notifRow('achievements','Conquistas')}
    ${notifRow('records','Recordes')}
  </div>

  <div class="section-title">Perfil</div>
  <div class="card" style="margin-bottom:18px;">
    <div class="field"><label>Nome</label><input type="text" id="setName" value="${uRec?uRec.name:''}"></div>
    <div class="field"><label>E-mail</label><input type="email" value="${currentEmail}" disabled style="opacity:.6;"></div>
    <div class="grid-2">
      <div class="field"><label>Idade</label><input type="number" id="setIdade" value="${p.idade||''}"></div>
      <div class="field"><label>Peso (kg)</label><input type="number" id="setPeso" value="${p.peso||''}"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Altura (cm)</label><input type="number" id="setAltura" value="${p.altura||''}"></div>
      <div class="field"><label>Sexo</label>
        <select id="setSexo"><option ${p.sexo==='Masculino'?'selected':''}>Masculino</option><option ${p.sexo==='Feminino'?'selected':''}>Feminino</option></select>
      </div>
    </div>
    <div class="field"><label>Objetivo</label>
      <select id="setObjetivo">${['Ganhar massa muscular','Ganhar peso','Perder peso','Definir o corpo','Melhorar condicionamento','Aumentar força','Melhorar resistência'].map(o=>`<option ${p.objetivo===o?'selected':''}>${o}</option>`).join('')}</select>
    </div>
    <button class="btn btn-primary btn-block" id="saveProfileBtn">Salvar alterações</button>
  </div>

  <div class="section-title">Preferências</div>
  <div class="card" style="margin-bottom:18px;">
    <div class="field"><label>Tempo padrão de descanso</label>
      <select id="setRestDefault">${[30,45,60,90,120].map(t=>`<option value="${t}" ${userData.restDefault===t?'selected':''}>${t} segundos</option>`).join('')}</select>
    </div>
  </div>

  <div class="section-title">Conta</div>
  <div class="card"><button class="btn btn-danger btn-block" id="settingsLogout">Sair</button></div>
  `;
}
function notifRow(key,label){
  const on = userData.notifications[key];
  return `<div class="settings-row"><div class="settings-row-text"><b>${label}</b></div><button class="switch ${on?'on':''}" data-notif="${key}"></button></div>`;
}
function notificationPermissionState(){
  if(typeof Notification === 'undefined') return 'unsupported';
  return Notification.permission; // 'default' | 'granted' | 'denied'
}
function renderNotificationPermissionBanner(){
  const state = notificationPermissionState();
  if(state==='unsupported'){
    return `<div class="settings-row"><div class="settings-row-text"><b>Notificações não suportadas</b><span>Este navegador não oferece suporte a notificações.</span></div></div>`;
  }
  if(state==='granted'){
    return `<div class="settings-row"><div class="settings-row-text"><b style="color:var(--success);">Notificações ativadas</b><span>Este dispositivo autorizou o EVORA FIT a enviar notificações.</span></div>${icon('check-circle-2')}</div>`;
  }
  if(state==='denied'){
    return `<div class="settings-row"><div class="settings-row-text"><b style="color:var(--danger);">Bloqueadas pelo dispositivo</b><span>As notificações foram bloqueadas. Ative-as nas configurações do navegador/sistema.</span></div></div>`;
  }
  return `<div class="settings-row"><div class="settings-row-text"><b>Permissão necessária</b><span>Receba lembretes importantes do seu treino.</span></div><button class="btn btn-secondary" id="enableNotifBtn">Habilitar</button></div>`;
}

    {icon:'help-circle', title:'Dúvidas sobre o aplicativo'},

/* ================================================================ */
/* ===== VIEW EVENT BINDING ===== */
/* ================================================================ */
function bindViewEvents(){
  // dashboard / workout start
  document.querySelectorAll('[data-start-workout]').forEach(b=> b.onclick = ()=> startWorkoutSession(b.getAttribute('data-start-workout')));
  document.querySelectorAll('[data-workout]').forEach(b=> b.onclick = ()=> navigate('workout-detail', {id:b.getAttribute('data-workout')}));

  // workouts filter
  document.querySelectorAll('[data-wf]').forEach(b=> b.onclick = ()=>{ uiFilters.workoutFilter = b.getAttribute('data-wf'); persistFilters(); renderApp(); });

  // exercises
  document.querySelectorAll('[data-muscle]').forEach(b=> b.onclick = ()=>{ uiFilters.exObj='Todos'; uiFilters.exEquip='Todos'; persistFilters(); navigate('exercise-list', {muscle:b.getAttribute('data-muscle')}); });
  document.querySelectorAll('[data-exf-obj]').forEach(b=> b.onclick = ()=>{ uiFilters.exObj=b.getAttribute('data-exf-obj'); persistFilters(); renderApp(); });
  document.querySelectorAll('[data-exf-eq]').forEach(b=> b.onclick = ()=>{ uiFilters.exEquip=b.getAttribute('data-exf-eq'); persistFilters(); renderApp(); });
  document.querySelectorAll('[data-exercise]').forEach(b=> b.onclick = ()=> navigate('exercise-detail', {id:b.getAttribute('data-exercise')}));
  document.querySelectorAll('[data-back-muscle]').forEach(b=> b.onclick = ()=> navigate('exercise-list', {muscle:b.getAttribute('data-back-muscle')}));

  // build workout
  if(route.view==='build-workout') bindBuildWorkoutExtra();

  // progress
  const regWeight = document.getElementById('registerWeightBtn');
  if(regWeight) regWeight.onclick = ()=> openModal(renderWeightModal());

  // history calendar
  const calPrev = document.getElementById('calPrev');
  if(calPrev) calPrev.onclick = ()=>{ uiFilters.calMonth--; if(uiFilters.calMonth<0){uiFilters.calMonth=11; uiFilters.calYear--;} persistFilters(); navigate('history', {}); };
  const calNext = document.getElementById('calNext');
  if(calNext) calNext.onclick = ()=>{ uiFilters.calMonth++; if(uiFilters.calMonth>11){uiFilters.calMonth=0; uiFilters.calYear++;} persistFilters(); navigate('history', {}); };
  document.querySelectorAll('[data-cal-day]').forEach(b=> b.onclick = ()=> navigate('history', {date:b.getAttribute('data-cal-day')}));
  document.querySelectorAll('[data-hf]').forEach(b=> b.onclick = ()=>{ uiFilters.historyMuscle=b.getAttribute('data-hf'); persistFilters(); renderApp(); });
  document.querySelectorAll('[data-hp]').forEach(b=> b.onclick = ()=>{
    const val = b.getAttribute('data-hp');
    if(val==='custom'){ openModal(renderCustomRangeModal()); return; }
    uiFilters.historyPeriod = val; persistFilters(); navigate('history', {});
  });
  document.querySelectorAll('[data-jump-date]').forEach(b=> b.onclick = ()=>{
    const date = b.getAttribute('data-jump-date');
    const d = new Date(date+'T00:00:00');
    uiFilters.calMonth = d.getMonth(); uiFilters.calYear = d.getFullYear();
    persistFilters();
    navigate('history', {date});
  });

  // evora+
  document.querySelectorAll('[data-product]').forEach(b=> b.onclick = ()=>{
    const p = evoraProducts.find(x=>x.id===b.getAttribute('data-product'));
    openModal(renderProductModal(p));
  });

  // settings
  document.querySelectorAll('[data-theme-pref]').forEach(b=> b.onclick = ()=>{ setThemePref(b.getAttribute('data-theme-pref')); renderApp(); });
  document.querySelectorAll('[data-notif]').forEach(b=> b.onclick = ()=>{
    const key = b.getAttribute('data-notif');
    userData.notifications[key] = !userData.notifications[key];
    persist(); renderApp();
  });
  const enableNotifBtn = document.getElementById('enableNotifBtn');
  if(enableNotifBtn) enableNotifBtn.onclick = ()=>{
    if(typeof Notification === 'undefined'){ toast('Notificações não são suportadas neste navegador.', 'alert-circle'); return; }
    Notification.requestPermission().then(()=>{ renderApp(); });
  };
  const saveProfile = document.getElementById('saveProfileBtn');
  if(saveProfile) saveProfile.onclick = ()=>{
    const users = loadUsers();
    users[currentEmail].name = document.getElementById('setName').value || users[currentEmail].name;
    saveUsers(users);
    userData.profile = {
      idade: document.getElementById('setIdade').value,
      peso: document.getElementById('setPeso').value,
      altura: document.getElementById('setAltura').value,
      sexo: document.getElementById('setSexo').value,
      objetivo: document.getElementById('setObjetivo').value
    };
    persist();
    toast('Perfil atualizado.','check-circle');
    renderApp();
  };
  const setRest = document.getElementById('setRestDefault');
  if(setRest) setRest.onchange = ()=>{ userData.restDefault = parseInt(setRest.value); persist(); toast('Preferência salva.','check-circle'); };
  const settingsLogout = document.getElementById('settingsLogout');
  if(settingsLogout) settingsLogout.onclick = doLogout;

  // support
  const contactBtn = document.getElementById('contactSupportBtn');
  if(contactBtn) contactBtn.onclick = ()=> window.open('mailto:suporte@evorafit.com', '_blank');

  // modal generic
  bindModalEvents();
}

function bindModalEvents(){
  const cancel = document.getElementById('modalCancel');
  if(cancel) cancel.onclick = closeModal;
  const confirmExit = document.getElementById('confirmExit');
  if(confirmExit) confirmExit.onclick = ()=>{
    cancelRestNotification();
    sessionState = null;
    persistSession();
    clearInterval(sessionTimerHandle);
    clearInterval(restHandle);
    modalContent = null;
    navigate('dashboard');
  };
  const cancelExit = document.getElementById('cancelExit');
  if(cancelExit) cancelExit.onclick = ()=>{ modalContent=null; renderApp(); };
  const confirmFinishEarly = document.getElementById('confirmFinishEarly');
  if(confirmFinishEarly) confirmFinishEarly.onclick = ()=>{ modalContent=null; finishWorkout(); };
  const finishClose = document.getElementById('finishModalClose');
  if(finishClose) finishClose.onclick = closeModal;
  const modalAddConfirm = document.getElementById('modalAddConfirm');
  if(modalAddConfirm) modalAddConfirm.onclick = ()=>{
    const exerciseId = document.getElementById('modalExSelect').value;
    const sets = parseInt(document.getElementById('modalSets').value)||3;
    const reps = parseInt(document.getElementById('modalReps').value)||10;
    const weight = document.getElementById('modalWeight').value;
    const rest = document.getElementById('modalRest').value;
    uiTmp.build.items.push({exerciseId, sets, reps, weight: weight?parseFloat(weight):null, rest: rest?parseInt(rest):null});
    closeModal();
  };
  const weightSave = document.getElementById('weightSaveBtn');
  if(weightSave) weightSave.onclick = ()=>{
    const val = parseFloat(document.getElementById('weightInput').value);
    const date = document.getElementById('weightDate').value || todayISO();
    if(!val){ toast('Informe um valor de peso.','alert-circle'); return; }
    userData.weightLog.push({date, weight:val});
    persist();
    closeModal();
    toast('Peso registrado.','check-circle');
  };
  const customRangeOk = document.getElementById('customRangeOk');
  if(customRangeOk) customRangeOk.onclick = ()=>{
    const from = document.getElementById('customFrom').value;
    const to = document.getElementById('customTo').value;
    if(!from || !to){ toast('Selecione as duas datas.','alert-circle'); return; }
    uiFilters.historyPeriod = 'custom';
    uiFilters.historyCustomFrom = from;
    uiFilters.historyCustomTo = to;
    persistFilters();
    modalContent = null;
    navigate('history', {});
  };
}
function renderWeightModal(){
  return `
  <h3>Registrar peso</h3>
  <div class="field"><label>Peso (kg)</label><input type="number" step="0.1" id="weightInput" placeholder="Ex: 78.4"></div>
  <div class="field"><label>Data</label><input type="date" id="weightDate" value="${todayISO()}"></div>
  <div class="modal-actions">
    <button class="btn btn-primary" id="weightSaveBtn">Salvar</button>
    <button class="btn btn-ghost" id="modalCancel">Cancelar</button>
  </div>`;
}

/* ================================================================ */
/* ===== PWA (manifest + service worker, montados em runtime) ===== */
/* ================================================================ */
/* Como o app inteiro vive em um único index.html, o manifest e o
   Service Worker são gerados em memória e anexados via Blob URL.
   O Service Worker é quem efetivamente dispara a notificação nativa do
   sistema (self.registration.showNotification), separado da lógica do
   cronômetro/descanso que roda na página — ver scheduleRestNotification()
   e cancelRestNotification() acima.

   LIMITAÇÃO HONESTA DESTE MVP: sem um backend/servidor de push real, o
   agendamento abaixo depende do navegador manter o Service Worker vivo
   entre o início do descanso e o fim (setTimeout dentro do SW). Isso
   funciona na grande maioria dos casos com a aba em segundo plano ou o
   app instalado como PWA, mas não é garantido se o sistema operacional
   encerrar o navegador por completo — esse cenário só é 100% confiável
   com Web Push via servidor (Push API + VAPID), por isso o SW já inclui
   um listener de 'push' pronto para quando esse backend existir. */
(function setupPWA(){
  try{
    const manifest = {
      name:'EVORA FIT', short_name:'EVORA FIT',
      description:'Treine. Evolua. Supere você mesmo.',
      start_url:'.', display:'standalone', background_color:'#0a0a0c', theme_color:'#0a0a0c',
      icons:[{ src: FAVICON_DATA_URL, sizes:'64x64', type:'image/svg+xml', purpose:'any' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const link = document.getElementById('manifestLink');
    if(link) link.href = URL.createObjectURL(blob);
  }catch(e){ /* manifest indisponível neste navegador — segue normalmente */ }

  if('serviceWorker' in navigator){
    try{
      const swCode = `
        let pendingRestTimeout = null;

        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', () => {});

        // ----- Camada: disparo da notificação (agendado pela página) -----
        self.addEventListener('message', (event) => {
          const data = event.data || {};
          if(data.type === 'SCHEDULE_REST_NOTIFICATION'){
            if(pendingRestTimeout) clearTimeout(pendingRestTimeout);
            const delay = Math.max(0, data.endAt - Date.now());
            pendingRestTimeout = setTimeout(() => {
              self.registration.showNotification(data.title || 'EVORA FIT', {
                body: data.body || 'Descanso finalizado. Hora da próxima série.',
                icon: data.icon, badge: data.icon, tag: 'evora-rest', renotify: true, vibrate: [120,60,120]
              });
              pendingRestTimeout = null;
            }, delay);
          }
          if(data.type === 'CANCEL_REST_NOTIFICATION'){
            if(pendingRestTimeout){ clearTimeout(pendingRestTimeout); pendingRestTimeout = null; }
          }
        });

        // ----- Camada: Push API — pronta para um backend/push server futuro -----
        self.addEventListener('push', (event) => {
          let payload = { title:'EVORA FIT', body:'Você tem uma nova notificação.' };
          try{ if(event.data) payload = event.data.json(); }catch(e){}
          event.waitUntil(self.registration.showNotification(payload.title || 'EVORA FIT', {
            body: payload.body, icon: payload.icon, badge: payload.icon
          }));
        });

        self.addEventListener('notificationclick', (event) => {
          event.notification.close();
          event.waitUntil(self.clients.matchAll({type:'window', includeUncontrolled:true}).then((list) => {
            if(list && list.length){ return list[0].focus(); }
            return self.clients.openWindow('.');
          }));
        });
      `;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).then(reg=>{ swRegistration = reg; }).catch(()=>{ /* registro de SW via blob nem sempre é suportado — falha de forma silenciosa */ });
    }catch(e){ /* ambiente sem suporte a Service Worker */ }
  }
})();
